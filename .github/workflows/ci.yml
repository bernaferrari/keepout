name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rethink-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: KMP web
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Build and verify web distribution
        run: ./scripts/verify-web-deploy.sh --ci --web-only

      - name: Shared JVM regression tests
        run: ./gradlew :shared:jvmTest --console=plain

  android:
    name: Android (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        variant: [PlayDebug, FdroidDebug, WebsiteDebug]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Prepare synthetic Firebase options for debug CI
        if: matrix.variant == 'PlayDebug' || matrix.variant == 'WebsiteDebug'
        run: |
          python3 -m unittest discover -s scripts/tests -p test_debug_firebase.py -v
          python3 scripts/prepare-debug-firebase.py

      - name: Compile variant and run unit tests
        run: ./gradlew :app:compile${{ matrix.variant }}Kotlin :app:test${{ matrix.variant }}UnitTest --console=plain
      - name: Detekt
        if: matrix.variant == 'PlayDebug'
        run: ./gradlew :app:detekt --console=plain

      - name: Verify design-system screenshot goldens
        if: matrix.variant == 'PlayDebug'
        run: ./gradlew :app:verifyRoborazziPlayDebug --tests "*Screenshot*" --console=plain

      - name: Upload screenshot diffs
        if: failure() && matrix.variant == 'PlayDebug'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roborazzi-diffs
          path: app/build/outputs/roborazzi/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.variant }}
          path: app/build/test-results/
          if-no-files-found: ignore

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Prepare synthetic Firebase options for debug CI
        run: |
          python3 -m unittest discover -s scripts/tests -p test_debug_firebase.py -v
          python3 scripts/prepare-debug-firebase.py

      - name: Lint (warningsAsErrors, baseline-ratcheted)
        run: ./gradlew :app:lintPlayDebug :app:lintFdroidDebug :app:lintWebsiteDebug --console=plain

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results*
