<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../_assets/frame.css"><link rel="stylesheet" href="style.css">
<script src="../_assets/data.js"></script>
<style>
.top{height:64px;display:flex;align-items:center;padding:0 12px 0 8px;gap:4px}
.ib{width:44px;height:44px;display:grid;place-items:center}
.top h1{flex:1;font:900 44px/1 var(--display);text-transform:uppercase;letter-spacing:.01em;padding-top:4px}
.sw{display:flex;background:var(--plate);border-radius:12px;padding:3px;border:1.5px solid var(--ink)}
.sw span{height:32px;padding:0 12px;display:flex;align-items:center;border-radius:9px;font:800 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase}
.sw span.on{background:var(--ink);color:var(--bg)}
.ticker{margin:6px 12px 0;height:52px;border-radius:16px;background:var(--stop);color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px 0 10px;overflow:hidden}
.ticker .k{font:800 10.5px/1.15 var(--ui);letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.ticker .d{font:600 14px/1.2 var(--mono);white-space:nowrap}
.filters{display:flex;gap:6px;padding:12px 12px 10px;align-items:center}
.f{height:38px;padding:0 12px;border-radius:10px;background:var(--plate);display:flex;align-items:center;gap:7px;font:800 11.5px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:var(--ink)}
.f em{font:900 17px/1 var(--display);font-style:normal;letter-spacing:0}
.f.on{background:var(--ink);color:var(--bg)}
.f.st em{color:var(--stop)}
.f.sq{width:38px;padding:0;justify-content:center}
.list{padding:0 12px;display:flex;flex-direction:column;gap:5px}
.e{border-radius:16px;background:var(--plate);display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;min-height:62px}
.e .ico{position:relative;flex:none;width:38px;height:38px}
.e .ico .seal{position:absolute;right:-5px;bottom:-5px;filter:drop-shadow(0 0 0 var(--plate))}
.e .d{font:500 14px/1.25 var(--mono);color:var(--ink2);letter-spacing:-.015em}
.e .d b{font-weight:600;color:var(--ink)}
.e .m{margin-top:5px;display:flex;align-items:center;gap:8px;font:500 12.5px/1 var(--ui);color:var(--ink2);white-space:nowrap}
.e .t{align-self:flex-start;margin-top:3px;font:500 11.5px/1 var(--mono);color:var(--ink3)}
.stamp{height:20px;padding:0 7px;border-radius:5px;background:var(--stop);color:#fff;display:inline-flex;align-items:center;font:800 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.e.x{background:var(--stopTint)}
</style></head><body>
<div class="phone">
  <div class="status"></div>
  <div class="top">
    <span class="ib"><span class="ms">arrow_back</span></span>
    <h1>Logs</h1>
    <div class="sw"><span class="on">Network</span><span>DNS</span></div>
    <span class="ib" style="width:36px"><span class="ms">more_vert</span></span>
  </div>
  <div class="ticker">
    <span id="tk"></span>
    <div class="grow"><div class="k">Just stopped · Chrome</div><div class="d">googleads.g.doubleclick.net</div></div>
    <span class="ms" style="font-size:22px">chevron_right</span>
  </div>
  <div class="filters">
    <span class="f on">All <em>579</em></span>
    <span class="f">Through <em>457</em></span>
    <span class="f st">Stopped <em>122</em></span>
    <span style="flex:1"></span>
    <span class="f sq"><span class="ms" style="font-size:20px">filter_list</span></span>
  </div>
  <div class="list" id="log"></div>
  <div class="nav">
    <a><span class="ms">home</span>Home</a>
    <a><span class="ms">bar_chart</span>Stats</a>
    <a class="on"><span class="ms">settings</span>Settings</a>
  </div>
</div>
<script>
$('#tk').innerHTML = sealSvg(34, { fill: '#fff', bar: 'var(--stop)' });
const MAXC = 28; $('#log').innerHTML = KP.logs.map(([t, sub, root, app, ic, x, how, det]) => `
  <div class="e ${x ? 'x' : ''}">
    <span class="ico">${appIcon(ic, 38, app)}${x ? sealSvg(20) : ''}</span>
    <div class="grow">
      <div class="d ell">${fitDomain(sub, root, MAXC)}<b>${root}</b></div>
      <div class="m">${x ? `<span class="stamp">Stopped · ${how === 'DNS' ? 'DNS' : 'App rule'}</span><span class="ell">${how === 'DNS' ? det.split(',')[0] : app}</span>` : `<span>${app}</span><span>·</span><span>${how}</span><span>·</span><span>↓ ${det}</span>`}</div>
    </div>
    <span class="t">${t.slice(0, 5)}</span>
  </div>`).join('');
frame();
</script></body></html>
